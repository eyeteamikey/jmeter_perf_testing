name: JMeter Performance Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          path: repo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          cd repo
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      # - name: Start Docker Services (Grafana & InfluxDB)
      #   run: |
      #     cd repo
      #     docker compose up -d
      #     sleep 15  # Wait for Grafana/Influx to be ready

      - name: Download and Extract JMeter
        run: |
          cd repo
          mkdir -p tools
          curl -L https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar zx -C tools
          echo "JMETER_PATH=$PWD/tools/apache-jmeter-5.6.3/bin/jmeter" >> $GITHUB_ENV

      - name: Run JMeter Test
        run: |
          cd repo
          python run_test.py --test-type spike_nometrics --env config/env_config.yml --skip-monitoring

      - name: Upload JMeter Results as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: |
            repo/reports/**/results.jtl
            repo/reports/**/index.html
            repo/reports/**/statistics.json
          if-no-files-found: warn

      # - name: Stop Docker Services
      #   if: always()
      #   run: |
      #     cd repo
      #     docker compose down --volumes
