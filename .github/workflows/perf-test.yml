name: JMeter Performance Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          path: repo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          cd repo
          pip install -r requirements.txt

      - name: Start Docker Services (Grafana & InfluxDB)
        run: |
          cd repo
          docker compose up -d
          sleep 15  # Wait for Grafana/Influx to be ready

      - name: Download and Extract JMeter
        run: |
          cd repo
          mkdir -p tools
          curl -L https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar zx -C tools
          echo "JMETER_PATH=$PWD/tools/apache-jmeter-5.6.3/bin/jmeter" >> $GITHUB_ENV

      - name: Run JMeter Test
        run: |
          cd repo
          python run_test.py --test-type stress --env config/env_config.yml

      - name: Stop Docker Services
        if: always()
        run: |
          cd repo
          docker compose down --volumes
